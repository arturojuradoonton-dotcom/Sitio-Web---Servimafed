<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="spinner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FCB326" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FCB326" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes spin-smooth {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 0.94; }
      50% { transform: scale(1.03); opacity: 1; }
    }
    .spinner-ring {
      transform-origin: 50px 50px;
      animation: spin-smooth 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .isotipo-center {
      transform-origin: 50px 50px;
      animation: pulse-subtle 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Track Ring (Subtle clean guide) -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#142640" stroke-width="1.5" opacity="0.1"/>

  <!-- Active Spinner Arc (Fine 2.2px fluid arc) -->
  <circle 
    class="spinner-ring" 
    cx="50" 
    cy="50" 
    r="38" 
    fill="none" 
    stroke="url(#spinner-grad)" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-dasharray="75 165"
  />

  <!-- Center Official Servimafed Isotipo -->
  <g class="isotipo-center">
    <image 
      href="data:image/png;base64," 
      x="34" 
      y="34" 
      width="32" 
      height="32" 
      preserveAspectRatio="xMidYMid meet" 
    />
  </g>
</svg>